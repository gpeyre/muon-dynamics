name: Numerical toolbox

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[experiments]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce.py --check
      - run: python scripts/reproduce.py --examples --output outputs/examples
      - run: python scripts/reproduce.py --all --smoke --output outputs/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-checks
          path: outputs/
