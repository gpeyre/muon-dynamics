[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muon-dynamics"
version = "0.1.0"
description = "Spectral Wasserstein computations and Muon mean-field experiments"
readme = "readme.md"
requires-python = ">=3.10"
authors = [{name = "Gabriel Peyre"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/gpeyre/muon-dynamics"
Paper = "https://arxiv.org/abs/2604.04891"

[project.optional-dependencies]
transport = ["cvxpy>=1.4"]
torch = ["torch>=2.1"]
notebooks = ["matplotlib>=3.7", "jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.9"]
experiments = ["torch>=2.1", "cvxpy>=1.4", "matplotlib>=3.7", "jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]
